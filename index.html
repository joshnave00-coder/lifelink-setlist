<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Life Link Setlist</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f1f2f4;
        --surface: #ffffff;
        --surface-2: #f7f7f7;
        --text: #383838;
        --heading: #1a1a1a;
        --dim: #6b6b6b;
        --border: #e6e6e6;
        --accent: #0399e5;
        --accent-deep: #0277b6;
        --grad: linear-gradient(90deg, #22d6e4, #0399e5);
        --grad-135: linear-gradient(135deg, #22d6e4, #0399e5);
        --radius: 14px;
        --player-h: 0px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1316;
          --surface: #161d21;
          --surface-2: #20292e;
          --text: #eef3f5;
          --heading: #ffffff;
          --dim: #a3b3ba;
          --border: #2c383e;
          --accent: #2ea9e8;
          --accent-deep: #2ea9e8;
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Helvetica Neue", Helvetica, Arial, system-ui, -apple-system, sans-serif;
        font-size: 16px;
        line-height: 1.45;
        padding-bottom: calc(var(--player-h) + env(safe-area-inset-bottom, 0px));
      }
      button, [role="button"], select, input { min-height: 2.25rem; font: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 40px; }

      /* ---------- header ---------- */
      .brand {
        display: flex; align-items: center; gap: 12px;
        padding: 6px 2px 14px;
      }
      .brand .logo-chip {
        background: #ffffff; border: 1px solid var(--border); border-radius: 10px;
        padding: 6px 10px; display: flex; align-items: center; flex: none;
      }
      .brand img { height: 30px; width: auto; display: block; }
      .brand h1 { font-size: 20px; line-height: 1.15; margin: 0; color: var(--heading); font-weight: 700; letter-spacing: -0.01em; }
      .brand p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
      .brand-rule { height: 3px; border-radius: 999px; background: var(--grad); margin: 0 2px 18px; }

      /* ---------- set navigation ---------- */
      .set-nav {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 12px; margin-bottom: 14px;
      }
      .set-nav-row { display: flex; align-items: stretch; gap: 8px; }
      .nav-btn {
        flex: none; width: 44px; border-radius: 10px; border: 1px solid var(--border);
        background: var(--surface-2); color: var(--heading); display: flex; align-items: center; justify-content: center;
      }
      .nav-btn:disabled { opacity: 0.35; cursor: default; }
      .nav-btn svg { width: 20px; height: 20px; }
      .set-select {
        flex: 1; min-width: 0; border-radius: 10px; border: 1px solid var(--border);
        background: var(--surface-2); color: var(--heading); padding: 8px 10px; font-weight: 600;
      }
      .set-meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .set-date { font-size: 14px; color: var(--dim); }
      .pill {
        font-size: 12px; font-weight: 700; color: #fff; background: var(--grad);
        border-radius: 999px; padding: 3px 10px; letter-spacing: 0.02em;
      }
      .pill.plain { background: var(--surface-2); color: var(--dim); border: 1px solid var(--border); }
      .play-set-btn {
        margin-left: auto; border: none; border-radius: 999px; background: var(--grad); color: #fff;
        font-weight: 700; font-size: 14px; padding: 8px 16px; display: inline-flex; align-items: center; gap: 7px; min-height: 2.5rem;
      }
      .play-set-btn svg { width: 15px; height: 15px; }

      /* ---------- song cards ---------- */
      .song {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        margin-bottom: 10px; overflow: hidden;
      }
      .song-main { display: flex; align-items: center; gap: 11px; padding: 11px 12px; width: 100%; }
      .song-pos { font-size: 13px; font-weight: 700; color: var(--dim); width: 16px; text-align: center; flex: none; }
      .thumb { width: 46px; height: 46px; border-radius: 9px; object-fit: cover; flex: none; background: var(--surface-2); }
      .thumb-fallback {
        width: 46px; height: 46px; border-radius: 9px; flex: none; background: var(--grad-135);
        color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px;
      }
      .song-info { flex: 1; min-width: 0; text-align: left; }
      .song-title { font-weight: 700; color: var(--heading); font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
      .song-sub { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; align-items: center; }
      .key-chip {
        font-size: 11.5px; font-weight: 700; color: #fff; background: var(--grad);
        border-radius: 999px; padding: 2px 8px; white-space: nowrap;
      }
      .tag-chip {
        font-size: 11.5px; font-weight: 700; color: var(--accent-deep); border: 1.5px solid var(--accent);
        border-radius: 999px; padding: 1px 8px; white-space: nowrap;
      }
      .ver-count { font-size: 12.5px; color: var(--dim); }
      .play-btn {
        flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--grad);
        color: #fff; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 2px 8px rgba(3, 153, 229, 0.35);
      }
      .play-btn svg { width: 19px; height: 19px; }
      .play-btn.is-playing { background: var(--surface-2); color: var(--accent); box-shadow: none; border: 1.5px solid var(--accent); }
      .expand-btn {
        flex: none; width: 40px; height: 44px; border: none; background: none; color: var(--dim);
        display: flex; align-items: center; justify-content: center;
      }
      .expand-btn svg { width: 20px; height: 20px; transition: transform 0.18s ease; }
      .song.open .expand-btn svg { transform: rotate(180deg); }
      .song-detail { display: none; border-top: 1px solid var(--border); padding: 12px; background: var(--surface-2); }
      .song.open .song-detail { display: block; }
      .song-note { font-size: 14px; margin: 0 0 10px; }
      .no-rec { font-size: 14px; color: var(--dim); margin: 0 0 10px; }

      .version {
        display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
        background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
        padding: 8px 10px; margin-bottom: 7px; color: var(--text);
      }
      .version .v-play {
        flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--accent);
        color: var(--accent); display: flex; align-items: center; justify-content: center; background: none;
      }
      .version .v-play svg { width: 15px; height: 15px; }
      .version.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
      .version.current .v-play { background: var(--grad); border: none; color: #fff; }
      .v-info { flex: 1; min-width: 0; }
      .v-label { font-weight: 600; color: var(--heading); font-size: 14.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .default-badge { font-size: 11px; font-weight: 700; color: #fff; background: var(--grad); border-radius: 999px; padding: 1.5px 8px; }
      .v-meta { font-size: 12.5px; color: var(--dim); margin-top: 1px; }
      .eq { display: none; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
      .eq span { width: 3px; background: var(--accent); border-radius: 2px; height: 100%; transform-origin: bottom; animation: eq-bounce 0.9s ease-in-out infinite; }
      .eq span:nth-child(2) { animation-delay: 0.25s; } .eq span:nth-child(3) { animation-delay: 0.5s; }
      .version.playing .eq, .song-main .eq.on { display: inline-flex; }
      @keyframes eq-bounce { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }

      .song-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
      .action-btn {
        display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; min-height: 2.5rem;
        border: 1px solid var(--border); background: var(--surface); color: var(--heading);
        font-size: 13.5px; font-weight: 600; padding: 7px 14px; text-decoration: none;
      }
      .action-btn svg { width: 15px; height: 15px; color: var(--accent); flex: none; }
      .action-btn .pg { color: var(--dim); font-weight: 500; }

      /* ---------- library ---------- */
      .section-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 2px 10px; }
      .section-head h2 { font-size: 19px; margin: 0; color: var(--heading); }
      .section-head span { font-size: 13px; color: var(--dim); }
      .search-box { position: relative; margin-bottom: 12px; }
      .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--dim); pointer-events: none; }
      .search-box input {
        width: 100%; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
        color: var(--heading); padding: 10px 12px 10px 38px; min-height: 2.75rem;
      }
      .empty-note { color: var(--dim); font-size: 14.5px; padding: 14px 4px; }
      .foot { margin-top: 30px; font-size: 13px; color: var(--dim); text-align: center; }

      /* ---------- player ---------- */
      .player {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
        background: var(--surface); border-top: 1px solid var(--border);
        box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.13);
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        display: none;
      }
      .player.on { display: block; }
      .player-inner { max-width: 760px; margin: 0 auto; }
      .seek-row { display: flex; align-items: center; gap: 9px; }
      .seek-row .t { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 34px; }
      .seek-row .t:last-child { text-align: right; }
      input[type="range"].seek {
        flex: 1; -webkit-appearance: none; appearance: none; height: 28px; background: transparent; cursor: pointer; min-height: 1.75rem;
      }
      input[type="range"].seek::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
      input[type="range"].seek::-moz-range-track { height: 6px; border-radius: 999px; background: var(--surface-2); }
      input[type="range"].seek::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 20px; height: 20px; margin-top: -8px;
        border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 1px 5px rgba(0,0,0,0.35);
      }
      input[type="range"].seek::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); }
      .p-row1 { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
      .p-row2 { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; }
      .p-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; background: var(--surface-2); }
      .p-info { flex: 1; min-width: 0; margin-right: 2px; }
      .p-title { font-weight: 700; color: var(--heading); font-size: 14.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .p-sub { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tp-btn {
        flex: none; width: 40px; height: 44px; border: none; background: none; color: var(--heading);
        display: flex; align-items: center; justify-content: center; border-radius: 8px;
      }
      .tp-btn svg { width: 21px; height: 21px; }
      .tp-btn:disabled { opacity: 0.3; }
      .tp-play {
        flex: none; width: 50px; height: 50px; border-radius: 50%; border: none; background: var(--grad);
        color: #fff; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 2px 10px rgba(3, 153, 229, 0.4);
      }
      .tp-play svg { width: 22px; height: 22px; }
      .speed-btn {
        flex: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--heading);
        border-radius: 999px; font-size: 12.5px; font-weight: 700; padding: 4px 10px; min-height: 2.25rem; min-width: 52px;
      }

      /* ---------- lyrics overlay ---------- */
      .lyrics-overlay {
        position: fixed; inset: 0; z-index: 60; background: var(--bg); display: none;
        flex-direction: column;
      }
      .lyrics-overlay.on { display: flex; }
      .lyr-head {
        display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
        background: var(--surface); border-bottom: 1px solid var(--border);
      }
      .lyr-head .lt { flex: 1; min-width: 0; }
      .lyr-head .lt b { color: var(--heading); display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lyr-head .lt span { font-size: 12.5px; color: var(--dim); }
      .lyr-close {
        flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
        background: var(--surface-2); color: var(--heading); display: flex; align-items: center; justify-content: center;
      }
      .lyr-close svg { width: 19px; height: 19px; }
      .lyr-body { flex: 1; overflow-y: auto; padding: 18px 18px 60px; scroll-behavior: smooth; }
      .lyr-inner { max-width: 620px; margin: 0 auto; }
      .lyr-section { font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent-deep); margin: 22px 0 6px; }
      .lyr-section:first-child { margin-top: 0; }
      .lyr-line {
        display: block; width: 100%; text-align: left; border: none; background: none; color: var(--dim);
        font-size: 19px; font-weight: 600; line-height: 1.35; padding: 5px 8px; border-radius: 8px; min-height: 2.25rem;
      }
      button.lyr-line { cursor: pointer; }
      .lyr-line.now { color: var(--heading); font-weight: 800; background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
      .lyr-hint { font-size: 13px; color: var(--dim); margin: 0 0 8px; }

      @media (prefers-reduced-motion: reduce) {
        .eq span { animation: none; }
        .lyr-body { scroll-behavior: auto; }
        .expand-btn svg { transition: none; }
      }
      @media (min-width: 640px) {
        .brand h1 { font-size: 22px; }
        .lyr-line { font-size: 21px; }
      }
    </style>
  </head>

        play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
        pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
        chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>',
        chevR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>',
        chevD: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 9.5L12 16l6.5-6.5"/></svg>',
        prev: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 6h2.2v12H7zM19 6.8v10.4c0 .8-.9 1.3-1.6.9L9.5 13a1.15 1.15 0 0 1 0-2l7.9-5.1c.7-.4 1.6.1 1.6.9z"/></svg>',
        next: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.8 6H17v12h-2.2zM5 6.8v10.4c0 .8.9 1.3 1.6.9l7.9-5.1a1.15 1.15 0 0 0 0-2L6.6 5.9C5.9 5.5 5 6 5 6.8z"/></svg>',
        back10: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.5 5.5A8 8 0 1 1 4 13"/><path d="M4 4v5h5"/><text x="12" y="16.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none">10</text></svg>',
        fwd10: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 5.5A8 8 0 1 0 20 13"/><path d="M20 4v5h-5"/><text x="12" y="16.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none">10</text></svg>',
        lyrics: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6h11M5 11h14M5 16h8"/></svg>',
        chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>',
        x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
      };

      function fmt(sec) {
        sec = Math.max(0, Math.round(sec || 0));
        return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
      }
      function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }
      function artFor(songName) {
        const s = SONGS.find((x) => x.name === songName);
        return s ? s.art : null;
      }
      function thumbHTML(songName, cls) {
        const art = artFor(songName);
        if (art) return '<img class="' + cls + '" src="assets/art/' + esc(art.file) + '" alt="" loading="lazy" />';
        return '<div class="thumb-fallback" aria-hidden="true">' + esc(songName.charAt(0)) + "</div>";
      }

      /* ---------------- player state ---------------- */
      const audio = $("#audio");
      let queue = [];        // track ids in play order
      let queueIdx = -1;     // index into queue
      let currentId = null;  // loaded track id
      let speeds = [1, 0.75, 1.25, 1.5, 0.5];
      let speedIdx = 0;
      let seeking = false;

      function trackQueueFromSet(set, tappedSongTitle, tappedId) {
        const q = [];
        set.songs.forEach((song) => {
          if (song.title === tappedSongTitle && tappedId) q.push(tappedId);
          else if (song.defaultId) q.push(song.defaultId);
        });
        return q;
      }

      function loadTrack(id, autoplay, newQueue, newIdx) {
        const t = TRACKS[id];
        if (!t) return;
        if (newQueue) { queue = newQueue; queueIdx = newIdx; }
        currentId = id;
        audio.src = "assets/audio/" + t.file;
        audio.playbackRate = speeds[speedIdx];
        $("#player").classList.add("on");
        document.documentElement.style.setProperty("--player-h", "172px");
        $("#tTotal").textContent = fmt(t.dur);
        $("#tElapsed").textContent = "0:00";
        $("#seek").value = 0;
        const art = artFor(t.base);
        const thumb = $("#pThumb"), fb = $("#pThumbFallback");
        if (art) { thumb.src = "assets/art/" + art.file; thumb.hidden = false; fb.hidden = true; }
        else { thumb.hidden = true; fb.hidden = false; fb.textContent = t.base.charAt(0); }
        $("#pTitle").textContent = t.base;
        $("#pSub").textContent = t.label + " · " + t.key;
        $("#tpLyrics").style.display = t.lyricKey ? "" : "none";
        updateTransport();
        refreshPlayingMarks();
        if (navigator.mediaSession) {
          try {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: t.title, artist: "Life Link Worship", album: t.key,
            });
          } catch (e) { /* metadata is a nicety only */ }
        }
        if (autoplay) audio.play().catch(() => {});
        if (lyricsOpen) renderLyrics();
      }

      function updateTransport() {
        const playing = !audio.paused && !audio.ended && !!currentId;
        $("#tpPlay").innerHTML = playing ? ICONS.pause : ICONS.play;
        $("#tpPrev").disabled = queueIdx <= 0;
        $("#tpNext").disabled = queueIdx < 0 || queueIdx >= queue.length - 1;
        if (navigator.mediaSession) {
          try { navigator.mediaSession.playbackState = playing ? "playing" : "paused"; } catch (e) {}
        }
      }

      function stepTrack(dir) {
        const n = queueIdx + dir;
        if (n < 0 || n >= queue.length) return;
        loadTrack(queue[n], true, null, n);
      }

      audio.addEventListener("play", updateTransport);
      audio.addEventListener("pause", updateTransport);
      audio.addEventListener("ended", () => {
        if (queueIdx >= 0 && queueIdx < queue.length - 1) stepTrack(1);
        else updateTransport();
      });
      audio.addEventListener("loadedmetadata", () => {
        $("#tTotal").textContent = fmt(audio.duration || TRACKS[currentId]?.dur || 0);
      });
      audio.addEventListener("timeupdate", () => {
        if (!seeking) {
          const d = audio.duration || 0;
          $("#seek").value = d ? Math.round((audio.currentTime / d) * 1000) : 0;
        }
        $("#tElapsed").textContent = fmt(audio.currentTime);
        syncLyrics();
      });

      $("#seek").addEventListener("input", (e) => {
        seeking = true;
        const d = audio.duration || 0;
        if (d) $("#tElapsed").textContent = fmt((Number(e.target.value) / 1000) * d);
      });
      $("#seek").addEventListener("change", (e) => {
        const d = audio.duration || 0;
        if (d) audio.currentTime = (Number(e.target.value) / 1000) * d;
        seeking = false;
      });
      $("#tpPlay").innerHTML = ICONS.play;
      $("#tpPlay").addEventListener("click", () => {
        if (!currentId) return;
        if (audio.paused) audio.play().catch(() => {}); else audio.pause();
      });
      $("#tpPrev").innerHTML = ICONS.prev;
      $("#tpPrev").addEventListener("click", () => stepTrack(-1));
      $("#tpNext").innerHTML = ICONS.next;
      $("#tpNext").addEventListener("click", () => stepTrack(1));
      $("#tpBack").innerHTML = ICONS.back10;
      $("#tpBack").addEventListener("click", () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
      $("#tpFwd").innerHTML = ICONS.fwd10;
      $("#tpFwd").addEventListener("click", () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });
      $("#tpClose").innerHTML = ICONS.x;
      $("#tpClose").addEventListener("click", () => {
        audio.pause(); audio.removeAttribute("src"); audio.load();
        currentId = null; queue = []; queueIdx = -1;
        $("#player").classList.remove("on");
        document.documentElement.style.setProperty("--player-h", "0px");
        refreshPlayingMarks();
        if (lyricsOpen) closeLyrics();
      });
      $("#speedBtn").addEventListener("click", () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        audio.playbackRate = speeds[speedIdx];
        $("#speedBtn").textContent = speeds[speedIdx] + "x";
      });
      $("#tpLyrics").innerHTML = ICONS.lyrics;
      $("#tpLyrics").addEventListener("click", () => {
        if (!currentId) return;
        const t = TRACKS[currentId];
        openLyrics(t.base, t.lyricKey, true);
      });

      if (navigator.mediaSession) {
        const setH = (action, fn) => { try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) {} };
        setH("play", () => audio.play().catch(() => {}));
        setH("pause", () => audio.pause());
        setH("previoustrack", () => stepTrack(-1));
        setH("nexttrack", () => stepTrack(1));
        setH("seekbackward", () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
        setH("seekforward", () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && lyricsOpen) closeLyrics();
      });

      /* ---------------- set list rendering ---------------- */
      let currentSetIdx = (() => {
        const now = new Date();
        const today = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
        let up = -1, latest = 0;
        SETS.forEach((s, i) => {
          if (s.dateISO >= today && (up === -1 || s.dateISO < SETS[up].dateISO)) up = i;
          if (s.dateISO > SETS[latest].dateISO) latest = i;
        });
        return up === -1 ? latest : up;
      })();

      const openSongs = new Set(); // "setIdx:title" or "lib:title" expanded cards

      function versionRowHTML(songTitle, trackId, defaultId, context) {
        const t = TRACKS[trackId];
        const isCur = trackId === currentId;
        const isPlaying = isCur && !audio.paused && !audio.ended;
        return (
          '<button type="button" class="version' + (isCur ? " current" : "") + (isPlaying ? " playing" : "") + '"' +
          ' data-play="' + esc(trackId) + '" data-context="' + context + '" data-song="' + esc(songTitle) + '">' +
          '<span class="v-play">' + (isPlaying ? ICONS.pause : ICONS.play) + "</span>" +
          '<span class="v-info"><span class="v-label">' + esc(t.label) +
          (trackId === defaultId ? ' <span class="default-badge">Set default</span>' : "") +
          '</span><span class="v-meta">' + esc(t.key) + " · " + fmt(t.dur) + "</span></span>" +
          '<span class="eq" aria-hidden="true"><span></span><span></span><span></span></span>' +
          "</button>"
        );
      }

      function actionsHTML(song) {
        let h = '<div class="song-actions">';
        if (song.lyricKey) {
          h += '<button type="button" class="action-btn" data-lyrics="' + esc(song.title) + '" data-lyrickey="' + esc(song.lyricKey) + '">' + ICONS.lyrics + "Lyrics</button>";
        }
        (song.charts || []).forEach((c) => {
          h += '<a class="action-btn" href="assets/charts/' + esc(c.file) + '" target="_blank" rel="noopener">' + ICONS.chart + esc(c.label) + ' <span class="pg">PDF · ' + c.pages + (c.pages === 1 ? " page" : " pages") + "</span></a>";
        });
        return h + "</div>";
      }

      function renderSet() {
        const set = SETS[currentSetIdx];
        const sel = $("#setSelect");
        sel.value = String(currentSetIdx);
        $("#setPrev").disabled = currentSetIdx <= 0;
        $("#setNext").disabled = currentSetIdx >= SETS.length - 1;
        $("#setDate").textContent = set.dateLabel;
        const now = new Date();
        const today = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
        const pill = $("#setPill");
        if (set.dateISO === today) { pill.hidden = false; pill.textContent = "Today"; }
        else if (set.dateISO > today && SETS.findIndex((s) => s.dateISO >= today) === currentSetIdx) { pill.hidden = false; pill.textContent = "Up next"; }
        else pill.hidden = true;
        const playable = set.songs.some((s) => s.defaultId);
        $("#playSetBtn").style.display = playable ? "" : "none";

        $("#setList").innerHTML = set.songs.map((song, i) => {
          const openKey = "set:" + song.title;
          const isOpen = openSongs.has(openKey);
          const def = song.defaultId ? TRACKS[song.defaultId] : null;
          const isCurSong = def && currentId && TRACKS[currentId] && TRACKS[currentId].base === song.title;
          const playing = isCurSong && !audio.paused && !audio.ended;
          let h = '<article class="song' + (isOpen ? " open" : "") + '">';
          h += '<div class="song-main">';
          h += '<span class="song-pos">' + (i + 1) + "</span>";
          h += thumbHTML(song.title, "thumb");
          h += '<div class="song-info"><div class="song-title">' + esc(song.title) + '</div><div class="song-sub">';
          song.keyChips.forEach((k) => { h += '<span class="key-chip">' + esc(k) + "</span>"; });
          if (song.bridgeTag) h += '<span class="tag-chip">Bridge tag</span>';
          h += '<span class="ver-count">' + (song.versions.length ? song.versions.length + (song.versions.length === 1 ? " recording" : " recordings") : "No recording") + "</span>";
          h += "</div></div>";
          if (def) {
            h += '<button type="button" class="play-btn' + (playing ? " is-playing" : "") + '" data-play="' + esc(def.id || song.defaultId) + '" data-context="set" data-song="' + esc(song.title) + '" aria-label="Play ' + esc(song.title) + '">' + (playing ? ICONS.pause : ICONS.play) + "</button>";
          }
          h += '<button type="button" class="expand-btn" data-expand="' + esc(openKey) + '" aria-label="Show versions and charts for ' + esc(song.title) + '" aria-expanded="' + isOpen + '">' + ICONS.chevD + "</button>";
          h += "</div>";
          h += '<div class="song-detail">';
          if (song.note) h += '<p class="song-note">' + esc(song.note) + "</p>";
          if (!song.versions.length) h += '<p class="no-rec">No recording of this song is in the player yet.</p>';
          song.versions.forEach((vid) => { h += versionRowHTML(song.title, vid, song.defaultId, "set"); });
          h += actionsHTML(song);
          h += "</div></article>";
          return h;
        }).join("");
      }

      /* ---------------- library rendering ---------------- */
      function renderLibrary(filter) {
        const q = (filter || "").trim().toLowerCase();
        const list = SONGS.filter((s) => !q || s.name.toLowerCase().includes(q));
        $("#libCount").textContent = list.length + (list.length === 1 ? " song" : " songs");
        if (!list.length) { $("#library").innerHTML = '<p class="empty-note">No songs match that search.</p>'; return; }
        $("#library").innerHTML = list.map((song) => {
          const openKey = "lib:" + song.name;
          const isOpen = openSongs.has(openKey);
          const keys = Array.from(new Set(song.versions.map((v) => TRACKS[v].key).filter(Boolean)));
          const fakeSong = { title: song.name, lyricKey: null, charts: song.charts };
          const anyLyric = song.versions.map((v) => TRACKS[v]).find((t) => t.lyricKey);
          if (anyLyric) fakeSong.lyricKey = anyLyric.lyricKey;
          let h = '<article class="song' + (isOpen ? " open" : "") + '">';
          h += '<div class="song-main">';
          h += thumbHTML(song.name, "thumb");
          h += '<div class="song-info"><div class="song-title">' + esc(song.name) + '</div><div class="song-sub">';
          keys.forEach((k) => { h += '<span class="key-chip">' + esc(k) + "</span>"; });
          h += '<span class="ver-count">' + song.versions.length + (song.versions.length === 1 ? " recording" : " recordings") + "</span>";
          h += "</div></div>";
          const firstId = song.versions[0];
          const isCurSong = currentId && TRACKS[currentId] && TRACKS[currentId].base === song.name;
          const playing = isCurSong && !audio.paused && !audio.ended;
          h += '<button type="button" class="play-btn' + (playing ? " is-playing" : "") + '" data-play="' + esc(firstId) + '" data-context="lib" data-song="' + esc(song.name) + '" aria-label="Play ' + esc(song.name) + '">' + (playing ? ICONS.pause : ICONS.play) + "</button>";
          h += '<button type="button" class="expand-btn" data-expand="' + esc(openKey) + '" aria-label="Show versions and charts for ' + esc(song.name) + '" aria-expanded="' + isOpen + '">' + ICONS.chevD + "</button>";
          h += "</div>";
          h += '<div class="song-detail">';
          song.versions.forEach((vid) => { h += versionRowHTML(song.name, vid, null, "lib"); });
          h += actionsHTML(fakeSong);
          h += "</div></article>";
          return h;
        }).join("");
      }

      function refreshPlayingMarks() {
        renderSet();
        renderLibrary($("#libSearch").value);
      }
      audio.addEventListener("play", refreshPlayingMarks);
      audio.addEventListener("pause", refreshPlayingMarks);

      /* ---------------- lyrics overlay ---------------- */
      let lyricsOpen = false;
      let lyrSong = null, lyrKey = null, lyrTimed = false, lyrLines = [], lastLyrIdx = -2, lyrUserScrolledAt = 0;

      function openLyrics(songTitle, lyricKey, fromPlayer) {
        lyrSong = songTitle; lyrKey = lyricKey;
        const rows = LYRICS[lyricKey] || [];
        const cur = currentId ? TRACKS[currentId] : null;
        lyrTimed = !!(cur && cur.base === songTitle && cur.lyricKey === lyricKey);
        lyrLines = rows.map(([frac, section, text]) => ({
          section, text, time: lyrTimed ? Math.round(frac * (cur.dur || 0)) : null,
        }));
        lastLyrIdx = -2;
        lyricsOpen = true;
        $("#lyricsOverlay").classList.add("on");
        document.body.style.overflow = "hidden";
        renderLyrics();
        $("#lyrBody").scrollTop = 0;
      }
      function closeLyrics() {
        lyricsOpen = false;
        $("#lyricsOverlay").classList.remove("on");
        document.body.style.overflow = "";
      }
      function renderLyrics() {
        if (!lyricsOpen) return;
        const cur = currentId ? TRACKS[currentId] : null;
        if (cur && lyrSong && cur.base !== lyrSong) { /* track changed away: keep showing opened song statically */ }
        $("#lyrTitle").textContent = lyrSong || "";
        $("#lyrSub").textContent = lyrTimed && cur ? cur.label + " · " + cur.key : "Lyrics";
        let h = "";
        if (lyrTimed) h += '<p class="lyr-hint">Tap a line to jump to it.</p>';
        let lastSection = null;
        lyrLines.forEach((ln, i) => {
          if (ln.section !== lastSection) { h += '<div class="lyr-section">' + esc(ln.section) + "</div>"; lastSection = ln.section; }
          if (lyrTimed) h += '<button type="button" class="lyr-line" data-seek="' + ln.time + '" data-idx="' + i + '">' + esc(ln.text) + "</button>";
          else h += '<span class="lyr-line">' + esc(ln.text) + "</span>";
        });
        $("#lyrInner").innerHTML = h || '<p class="lyr-hint">No lyrics are loaded for this song.</p>';
        lastLyrIdx = -2;
        syncLyrics(true);
      }
      function syncLyrics(force) {
        if (!lyricsOpen || !lyrTimed) return;
        const t = audio.currentTime;
        let idx = -1;
        for (let i = 0; i < lyrLines.length; i++) { if (lyrLines[i].time <= t) idx = i; else break; }
        if (idx === lastLyrIdx && !force) return;
        lastLyrIdx = idx;
        $$(".lyr-line", $("#lyrInner")).forEach((el) => {
          const on = Number(el.dataset.idx) === idx;
          el.classList.toggle("now", on);
          if (on && Date.now() - lyrUserScrolledAt > 4000) {
            el.scrollIntoView({ block: "center", behavior: "smooth" });
          }
        });
      }
      $("#lyrBody").addEventListener("scroll", () => { lyrUserScrolledAt = Date.now(); }, { passive: true });
      $("#lyrClose").innerHTML = ICONS.x;
      $("#lyrClose").addEventListener("click", closeLyrics);
      $("#lyrInner").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-seek]");
        if (!btn) return;
        audio.currentTime = Number(btn.dataset.seek);
        if (audio.paused) audio.play().catch(() => {});
        lyrUserScrolledAt = 0;
        syncLyrics(true);
      });

      /* ---------------- global click handling ---------------- */
      document.addEventListener("click", (e) => {
        const playBtn = e.target.closest("[data-play]");
        if (playBtn) {
          const id = playBtn.dataset.play, songTitle = playBtn.dataset.song, ctx = playBtn.dataset.context;
          if (id === currentId) {
            if (audio.paused) audio.play().catch(() => {}); else audio.pause();
            return;
          }
          if (ctx === "set") {
            const set = SETS[currentSetIdx];
            const q = trackQueueFromSet(set, songTitle, id);
            loadTrack(id, true, q, Math.max(0, q.indexOf(id)));
          } else {
            const song = SONGS.find((s) => s.name === songTitle);
            const q = song ? song.versions.slice() : [id];
            loadTrack(id, true, q, Math.max(0, q.indexOf(id)));
          }
          return;
        }
        const exp = e.target.closest("[data-expand]");
        if (exp) {
          const key = exp.dataset.expand;
          if (openSongs.has(key)) openSongs.delete(key); else openSongs.add(key);
          if (key.startsWith("set:")) renderSet(); else renderLibrary($("#libSearch").value);
          return;
        }
        const lyr = e.target.closest("[data-lyrics]");
        if (lyr) { openLyrics(lyr.dataset.lyrics, lyr.dataset.lyrickey, false); return; }
      });

      /* ---------------- set nav wiring ---------------- */
      const sel = $("#setSelect");
      sel.innerHTML = SETS.map((s, i) => '<option value="' + i + '">' + esc(s.shortLabel) + " · " + esc(s.dateLabel.replace(/^\w+,\s*/, "")) + "</option>").join("");
      sel.addEventListener("change", () => { currentSetIdx = Number(sel.value); renderSet(); });
      $("#setPrev").innerHTML = ICONS.chevL;
      $("#setNext").innerHTML = ICONS.chevR;
      $("#setPrev").addEventListener("click", () => { if (currentSetIdx > 0) { currentSetIdx--; renderSet(); } });
      $("#setNext").addEventListener("click", () => { if (currentSetIdx < SETS.length - 1) { currentSetIdx++; renderSet(); } });
      $("#playSetBtn").innerHTML = ICONS.play + "Play the set";
      $("#playSetBtn").addEventListener("click", () => {
        const set = SETS[currentSetIdx];
        const q = trackQueueFromSet(set, null, null);
        if (q.length) loadTrack(q[0], true, q, 0);
      });
      $("#libSearch").addEventListener("input", (e) => renderLibrary(e.target.value));

      renderSet();
      renderLibrary("");
    </script>
  </body>
</html>
